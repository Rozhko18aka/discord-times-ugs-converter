name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "assets/**"
      - "hook-tkinterdnd2.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "tests/**"
      - "ugs_converter.py"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --icon assets/app-icon.ico
          --add-data assets/app-icon.ico:assets
          --name Discord-Times-Graphics-Converter
          --additional-hooks-dir .
          ugs_converter.py

      - name: Smoke-test EXE
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\Discord-Times-Graphics-Converter.exe" `
            -ArgumentList "--help" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "EXE smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $file = ".\dist\Discord-Times-Graphics-Converter.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "$hash  Discord-Times-Graphics-Converter.exe" |
            Set-Content -LiteralPath ".\dist\Discord-Times-Graphics-Converter.exe.sha256" -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Times-Graphics-Converter-Windows
          path: |
            dist/Discord-Times-Graphics-Converter.exe
            dist/Discord-Times-Graphics-Converter.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Discord-Times-Graphics-Converter-Windows
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/Discord-Times-Graphics-Converter.exe" \
            "release/Discord-Times-Graphics-Converter.exe.sha256" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
